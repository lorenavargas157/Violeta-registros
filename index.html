<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Violeta - Registro</title>
<meta name="theme-color" content="#726BA0">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Violeta">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Lora:wght@500;600&family=Public+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#F5EFE6;
    --card:#FFFCF8;
    --ink:#37292C;
    --ink-soft:#6E5F62;
    --line:#E7DCCF;
    --feed:#C97B84;
    --feed-soft:#F3DEE0;
    --diaper:#7C9184;
    --diaper-soft:#DEE7E0;
    --sleep:#726BA0;
    --sleep-soft:#E2DFF0;
    --pump:#B9873F;
    --pump-soft:#F1E2C8;
    --radius:18px;
  }
  *{box-sizing:border-box;}
  html,body{margin:0; height:100%; background:var(--bg);}
  body{
    color:var(--ink);
    font-family:'Public Sans', -apple-system, sans-serif;
    padding-top:env(safe-area-inset-top);
    padding-bottom:env(safe-area-inset-bottom);
  }
  .app{
    min-height:100%;
    padding:20px 16px 40px;
    max-width:480px;
    margin:0 auto;
  }
  .app h1,.app h2{font-family:'Lora', Georgia, serif; font-weight:600; margin:0;}
  header{margin-bottom:18px;}
  header .title{display:flex; align-items:baseline; justify-content:space-between;}
  header h1{font-size:26px; color:var(--ink);}
  header .age{font-size:14px; color:var(--ink-soft);}
  .stats{display:grid; grid-template-columns:repeat(2,1fr); gap:8px; margin:16px 0 20px;}
  .stat{background:var(--card); border:1px solid var(--line); border-radius:var(--radius); padding:10px 8px; text-align:center;}
  .stat .label{font-size:11px; color:var(--ink-soft); letter-spacing:0.02em;}
  .stat .value{font-family:'Lora',serif; font-size:15px; margin-top:2px;}
  .stat.feed{border-color:var(--feed);}
  .stat.diaper{border-color:var(--diaper);}
  .stat.sleep{border-color:var(--sleep);}
  .stat.pump{border-color:var(--pump);}
  .stat .badge{
    display:inline-block;
    margin-top:5px;
    font-size:10.5px;
    font-weight:600;
    padding:2px 8px;
    border-radius:20px;
    letter-spacing:0.01em;
  }
  .actions{display:flex; flex-direction:column; gap:10px; margin-bottom:26px;}
  .action{border-radius:var(--radius); border:none; padding:14px 16px; font-size:16px; font-weight:600; font-family:'Public Sans',sans-serif; color:#fff; display:flex; align-items:center; justify-content:space-between; cursor:pointer; width:100%; transition:transform 0.12s ease;}
  .action:active{transform:scale(0.98);}
  .action.feed{background:var(--feed);}
  .action.diaper{background:var(--diaper);}
  .action.sleep{background:var(--sleep);}
  .action.sleep.active{background:#3F3A63;}
  .action.pump{background:var(--pump);}
  .action .icon{font-size:20px;}
  .subpanel{display:flex; gap:8px; margin-top:-4px; margin-bottom:2px; overflow:hidden; max-height:0; transition:max-height 0.2s ease;}
  .subpanel.open{max-height:60px;}
  .subpanel button{flex:1; border:1px solid var(--line); background:var(--card); border-radius:12px; padding:9px 6px; font-size:13px; color:var(--ink); cursor:pointer;}
  .subpanel.feed button:active{background:var(--feed-soft);}
  .subpanel.diaper button:active{background:var(--diaper-soft);}
  .timeline h2{font-size:15px; color:var(--ink-soft); font-weight:600; margin:22px 0 10px;}
  .day-group{margin-bottom:14px;}
  .day-label{font-size:12px; color:var(--ink-soft); margin-bottom:6px; padding-left:4px;}
  .entry{display:flex; align-items:center; gap:10px; background:var(--card); border:1px solid var(--line); border-radius:14px; padding:10px 12px; margin-bottom:6px;}
  .entry .dot{width:9px;height:9px;border-radius:50%;flex-shrink:0;}
  .entry.feed .dot{background:var(--feed);}
  .entry.diaper .dot{background:var(--diaper);}
  .entry.sleep .dot{background:var(--sleep);}
  .entry.pump .dot{background:var(--pump);}
  .entry .desc{flex:1; font-size:14px;}
  .entry .desc .sub{display:block; font-size:11px; color:var(--ink-soft); margin-top:1px;}
  .entry .time{font-size:12px; color:var(--ink-soft);}
  .entry .del{background:none; border:none; color:var(--ink-soft); font-size:16px; cursor:pointer; padding:2px 6px;}
  .empty{text-align:center; color:var(--ink-soft); font-size:14px; padding:24px 10px; border:1px dashed var(--line); border-radius:var(--radius);}

  .entry .edit{background:none; border:none; color:var(--ink-soft); font-size:14px; cursor:pointer; padding:2px 6px;}
  .add-past{
    display:block; width:100%; text-align:center; background:none; border:1px dashed var(--line);
    color:var(--ink-soft); font-size:13px; padding:10px; border-radius:14px; margin-top:4px; cursor:pointer;
  }
  .sleep-edit-link{background:none; border:none; color:var(--ink-soft); font-size:10.5px; text-decoration:underline; padding:0; margin-top:3px; cursor:pointer;}

  .modal-backdrop{
    position:fixed; inset:0; background:rgba(55,41,44,0.45); display:flex; align-items:flex-end;
    justify-content:center; z-index:50;
  }
  .modal{
    background:var(--card); width:100%; max-width:480px; border-radius:22px 22px 0 0; padding:20px 18px 28px;
  }
  .modal h3{font-family:'Lora',serif; font-size:18px; margin:0 0 14px;}
  .modal label{display:block; font-size:12px; color:var(--ink-soft); margin:12px 0 4px;}
  .modal select, .modal input[type="datetime-local"]{
    width:100%; padding:10px; border-radius:12px; border:1px solid var(--line); background:#fff; font-size:14px; color:var(--ink); font-family:'Public Sans',sans-serif;
  }
  .modal .checkrow{display:flex; align-items:center; gap:8px; margin-top:12px; font-size:13px; color:var(--ink);}
  .modal-buttons{display:flex; gap:10px; margin-top:20px;}
  .modal-buttons button{flex:1; border:none; border-radius:12px; padding:12px; font-size:14px; font-weight:600; cursor:pointer;}
  .modal-buttons .cancel{background:var(--bg); color:var(--ink-soft); border:1px solid var(--line);}
  .modal-buttons .save{background:var(--sleep); color:#fff;}
</style>
</head>
<body>
<div id="root" class="app"></div>
<script>
(function(){
  const STORAGE_KEY = 'violeta-log';
  const BIRTH = new Date('2026-09-05T00:00:00');
  let entries = [];
  let sleepStart = null;
  let openPanel = null;
  let modal = null;
  let notifEnabled = false;
  let notified = {};

  const root = document.getElementById('root');

  function pad(n){ return String(n).padStart(2,'0'); }
  function toInputVal(ts){
    if(!ts) return '';
    const d = new Date(ts);
    return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate())+'T'+pad(d.getHours())+':'+pad(d.getMinutes());
  }
  function fromInputVal(str){
    if(!str) return null;
    return new Date(str).getTime();
  }

  function load(){
    try{
      const raw = localStorage.getItem(STORAGE_KEY);
      if(raw){
        const parsed = JSON.parse(raw);
        entries = parsed.entries || [];
        sleepStart = parsed.sleepStart || null;
        notifEnabled = parsed.notifEnabled || false;
        notified = parsed.notified || {};
      }
    }catch(e){ entries = []; sleepStart = null; }
    render();
    scheduleNotifChecks();
  }
  function save(){
    try{ localStorage.setItem(STORAGE_KEY, JSON.stringify({entries, sleepStart, notifEnabled, notified})); }
    catch(e){ console.error('No se pudo guardar', e); }
  }

  function fmtAge(){
    const ms = Date.now() - BIRTH.getTime();
    const days = Math.floor(ms/86400000);
    const hours = Math.floor((ms%86400000)/3600000);
    if(days<=0) return hours+' h de nacida';
    return days+' día'+(days===1?'':'s')+', '+hours+' h';
  }
  function timeAgo(ts){
    if(!ts) return '—';
    const diff = Date.now()-ts;
    if(diff<0) return 'ahora';
    const m = Math.floor(diff/60000);
    if(m<1) return 'ahora';
    if(m<60) return 'hace '+m+' min';
    const h = Math.floor(m/60);
    const rem = m%60;
    return 'hace '+h+'h'+(rem?' '+rem+'min':'');
  }
  // Umbrales de alerta por tipo (horas): [aviso, máximo]
  // Basado en guías pediátricas: AAP (tomas cada 2-3h), cambio de pañal cada 2-3h,
  // ventanas de vigilia de 35-90 min para 0-4 semanas, extracción cada 2-3h,
  // y no dejarla dormir más de 3-4h seguidas sin despertar a comer.
  const THRESHOLDS = {
    feed: [2, 3],
    diaper: [2, 3],
    awake: [0.75, 1.5],
    pump: [2, 3],
    sleep: [3, 4]
  };
  function statusBadge(hoursSince, kind){
    const [warn, max] = THRESHOLDS[kind];
    if(hoursSince < warn) return {tier:'ok', label:'En tiempo', color:'#3E6B4F', bg:'#DCEBE0'};
    if(hoursSince < max){
      const remainMin = Math.max(1, Math.round((max - hoursSince) * 60));
      return {tier:'warn', label:`Faltan ${remainMin} min`, color:'#8A6A00', bg:'#F5E8C7'};
    }
    const overMin = Math.round((hoursSince - max) * 60);
    return {tier:'max', label: overMin < 1 ? '¡Ya es hora!' : `Atrasado ${overMin} min`, color:'#A43E3E', bg:'#F5D9D9'};
  }

  function lastOf(type){
    const filtered = entries.filter(e=>e.type===type);
    if(!filtered.length) return null;
    return filtered.reduce((a,b)=> a.ts>b.ts?a:b);
  }
  function fmtClock(ts){
    return new Date(ts).toLocaleTimeString('es-CO',{hour:'2-digit',minute:'2-digit'});
  }
  function fmtDayLabel(ts){
    const d = new Date(ts);
    const today = new Date();
    const yest = new Date(); yest.setDate(today.getDate()-1);
    const sameDay = (a,b)=>a.toDateString()===b.toDateString();
    if(sameDay(d,today)) return 'Hoy';
    if(sameDay(d,yest)) return 'Ayer';
    return d.toLocaleDateString('es-CO',{day:'numeric',month:'short'});
  }
  function awakeBeforeSleep(sleepEntry){
    const candidates = entries.filter(e=>e.type==='sleep' && e.end && e.id!==sleepEntry.id && e.end<=sleepEntry.ts);
    if(!candidates.length) return null;
    const prev = candidates.reduce((a,b)=> a.end>b.end?a:b);
    const diffMin = Math.round((sleepEntry.ts - prev.end)/60000);
    if(diffMin < 0) return null;
    const h = Math.floor(diffMin/60), m = diffMin%60;
    return h>0 ? `${h}h ${m}min` : `${m}min`;
  }

  function labelFor(e){
    if(e.type==='feed') return e.subtype==='pecho' ? 'Toma de pecho' : 'Toma de biberón';
    if(e.type==='diaper'){
      const map = {mojado:'Pañal mojado', sucio:'Pañal sucio', mixto:'Pañal mixto'};
      return map[e.subtype] || 'Pañal';
    }
    if(e.type==='sleep'){
      if(e.end){
        const mins = Math.round((e.end-e.ts)/60000);
        const h = Math.floor(mins/60), m = mins%60;
        return 'Durmió '+(h>0 ? h+'h '+m+'min' : m+'min');
      }
      return 'Empezó a dormir';
    }
    if(e.type==='pump') return 'Extracción'+(e.amount?` (${e.amount} ml)`:'');
    return '';
  }

  function logFeed(subtype){
    entries.push({id:Date.now()+'-'+Math.random(), type:'feed', subtype, ts:Date.now()});
    openPanel = null; render(); save();
  }
  function logDiaper(subtype){
    entries.push({id:Date.now()+'-'+Math.random(), type:'diaper', subtype, ts:Date.now()});
    openPanel = null; render(); save();
  }
  function logPump(amount){
    entries.push({id:Date.now()+'-'+Math.random(), type:'pump', ts:Date.now(), amount: amount || null});
    openPanel = null;
    render(); save();
  }

  // --- Recordatorios en el celular (funcionan mientras la app esté abierta,
  // aunque sea en segundo plano; no son notificaciones push verdaderas) ---
  function fireNotification(title, body){
    try{
      if('serviceWorker' in navigator && navigator.serviceWorker.controller){
        navigator.serviceWorker.ready.then(reg=>reg.showNotification(title,{body, icon:'icons/icon-192.png', tag:title}));
      } else if('Notification' in window){
        new Notification(title, {body, icon:'icons/icon-192.png'});
      }
    }catch(e){ console.error('No se pudo notificar', e); }
  }
  async function enableNotifications(){
    if(!('Notification' in window)){
      alert('Este navegador no soporta notificaciones.');
      return;
    }
    const perm = await Notification.requestPermission();
    notifEnabled = (perm === 'granted');
    if(!notifEnabled) alert('No se activaron los permisos de notificación.');
    render(); save();
  }
  function checkNotifications(){
    if(!notifEnabled || typeof Notification === 'undefined' || Notification.permission !== 'granted') return;
    const check = (kind, ts, label)=>{
      if(!ts) return;
      const hours = (Date.now()-ts)/3600000;
      const max = THRESHOLDS[kind][1];
      if(hours >= max && notified[kind] !== ts){
        fireNotification('¡Ya es hora! '+label, 'Ya pasaron '+max+'h desde la última vez.');
        notified[kind] = ts;
        save();
      }
    };
    check('feed', lastOf('feed')?.ts, 'Toma');
    check('diaper', lastOf('diaper')?.ts, 'Pañal');
    check('pump', lastOf('pump')?.ts, 'Extracción');

    if(sleepStart){
      const hours = (Date.now()-sleepStart)/3600000;
      const max = THRESHOLDS.sleep[1];
      if(hours >= max && notified.sleep !== sleepStart){
        fireNotification('¡Ya es hora! Despertar para comer', 'Lleva más de '+max+'h dormida.');
        notified.sleep = sleepStart;
        save();
      }
    } else {
      const sleepEntries = entries.filter(e=>e.type==='sleep');
      const lastEnd = sleepEntries.length ? sleepEntries.reduce((a,b)=>a.end>b.end?a:b).end : null;
      if(lastEnd){
        const hours = (Date.now()-lastEnd)/3600000;
        const max = THRESHOLDS.awake[1];
        if(hours >= max && notified.awake !== lastEnd){
          fireNotification('Puede estar sobrecansada', 'Lleva despierta más del tiempo recomendado.');
          notified.awake = lastEnd;
          save();
        }
      }
    }
  }
  function scheduleNotifChecks(){
    checkNotifications();
    setInterval(checkNotifications, 30000);
  }
  function toggleSleep(){
    if(sleepStart){
      entries.push({id:Date.now()+'-'+Math.random(), type:'sleep', ts:sleepStart, end:Date.now()});
      sleepStart = null;
    } else { sleepStart = Date.now(); }
    render(); save();
  }
  function deleteEntry(id){
    entries = entries.filter(e=>e.id!==id);
    render(); save();
  }
  function togglePanel(name){ openPanel = openPanel===name ? null : name; render(); }

  function openAddModal(){
    modal = {mode:'add', type:'feed', subtype:'pecho', start:toInputVal(Date.now()), end:'', ongoing:false};
    render();
  }
  function openEditModal(entry){
    modal = {
      mode:'edit', id:entry.id, type:entry.type, subtype:entry.subtype||'',
      start:toInputVal(entry.ts), end:entry.end?toInputVal(entry.end):'', ongoing:false,
      amount: entry.amount || ''
    };
    render();
  }
  function openEditSleepStart(){
    modal = {mode:'editSleepStart', start:toInputVal(sleepStart)};
    render();
  }
  function closeModal(){ modal = null; render(); }

  function modalSetField(field, value){
    modal[field] = value;
    render();
  }

  function saveModal(){
    if(modal.mode==='editSleepStart'){
      const t = fromInputVal(modal.start);
      if(t) sleepStart = t;
      closeModal(); save(); return;
    }
    if(modal.mode==='edit'){
      const e = entries.find(x=>x.id===modal.id);
      if(e){
        e.ts = fromInputVal(modal.start) || e.ts;
        if(e.type==='feed' || e.type==='diaper') e.subtype = modal.subtype;
        if(e.type==='pump') e.amount = modal.amount ? Number(modal.amount) : null;
        if(e.type==='sleep' && modal.end) e.end = fromInputVal(modal.end);
      }
      closeModal(); save(); return;
    }
    if(modal.mode==='add'){
      const startTs = fromInputVal(modal.start) || Date.now();
      if(modal.type==='sleep'){
        if(modal.ongoing){
          sleepStart = startTs;
        } else {
          entries.push({id:Date.now()+'-'+Math.random(), type:'sleep', ts:startTs, end: fromInputVal(modal.end) || startTs});
        }
      } else if(modal.type==='pump'){
        entries.push({id:Date.now()+'-'+Math.random(), type:'pump', ts:startTs, amount: modal.amount ? Number(modal.amount) : null});
      } else {
        entries.push({id:Date.now()+'-'+Math.random(), type:modal.type, subtype:modal.subtype, ts:startTs});
      }
      closeModal(); save(); return;
    }
  }

  function renderModal(){
    if(!modal) return '';
    const isAdd = modal.mode==='add';
    const isSleepStartEdit = modal.mode==='editSleepStart';
    let title = 'Editar registro';
    if(isAdd) title = 'Agregar registro atrasado';
    if(isSleepStartEdit) title = 'Editar hora en que se durmió';

    let body = '';
    if(isSleepStartEdit){
      body = `
        <label>Hora en que se durmió</label>
        <input type="datetime-local" data-field="start" value="${modal.start}">
      `;
    } else {
      const typeSelector = isAdd ? `
        <label>Tipo</label>
        <select data-field="type">
          <option value="feed" ${modal.type==='feed'?'selected':''}>Toma</option>
          <option value="diaper" ${modal.type==='diaper'?'selected':''}>Pañal</option>
          <option value="sleep" ${modal.type==='sleep'?'selected':''}>Sueño</option>
          <option value="pump" ${modal.type==='pump'?'selected':''}>Extracción</option>
        </select>
      ` : '';

      let subtypeField = '';
      if(modal.type==='feed'){
        subtypeField = `
          <label>Tipo de toma</label>
          <select data-field="subtype">
            <option value="pecho" ${modal.subtype==='pecho'?'selected':''}>Pecho</option>
            <option value="biberon" ${modal.subtype==='biberon'?'selected':''}>Biberón</option>
          </select>`;
      } else if(modal.type==='diaper'){
        subtypeField = `
          <label>Tipo de pañal</label>
          <select data-field="subtype">
            <option value="mojado" ${modal.subtype==='mojado'?'selected':''}>Mojado</option>
            <option value="sucio" ${modal.subtype==='sucio'?'selected':''}>Sucio</option>
            <option value="mixto" ${modal.subtype==='mixto'?'selected':''}>Mixto</option>
          </select>`;
      } else if(modal.type==='pump'){
        subtypeField = `
          <label>Cantidad (ml, opcional)</label>
          <input type="number" inputmode="numeric" data-field="amount" value="${modal.amount||''}">`;
      }

      let sleepFields = '';
      if(modal.type==='sleep'){
        sleepFields = `
          <label>Empezó a dormir</label>
          <input type="datetime-local" data-field="start" value="${modal.start}">
          ${isAdd ? `
          <div class="checkrow">
            <input type="checkbox" id="ongoing" data-field="ongoing" ${modal.ongoing?'checked':''}>
            <label style="margin:0;" for="ongoing">Todavía sigue durmiendo</label>
          </div>` : ''}
          ${(!modal.ongoing) ? `
          <label>Despertó</label>
          <input type="datetime-local" data-field="end" value="${modal.end}">` : ''}
        `;
      }

      const timeField = (modal.type!=='sleep') ? `
        <label>Hora</label>
        <input type="datetime-local" data-field="start" value="${modal.start}">
      ` : '';

      body = typeSelector + subtypeField + timeField + sleepFields;
    }

    return `
      <div class="modal-backdrop" data-action="modal-backdrop">
        <div class="modal" data-stop>
          <h3>${title}</h3>
          ${body}
          <div class="modal-buttons">
            <button class="cancel" data-action="modal-cancel">Cancelar</button>
            <button class="save" data-action="modal-save">Guardar</button>
          </div>
        </div>
      </div>
    `;
  }

  function render(){
    const lastFeed = lastOf('feed');
    const lastDiaper = lastOf('diaper');
    const lastPump = lastOf('pump');
    const sleepEntries = entries.filter(e=>e.type==='sleep');
    const lastSleepEnd = sleepEntries.length ? sleepEntries.reduce((a,b)=>a.end>b.end?a:b) : null;

    function badgeHtml(ts, kind){
      if(!ts) return '';
      const hours = (Date.now()-ts)/3600000;
      const s = statusBadge(hours, kind);
      return `<span class="badge" style="color:${s.color};background:${s.bg}">${s.label}</span>`;
    }

    const sorted = [...entries].sort((a,b)=>b.ts-a.ts);
    const groups = [];
    sorted.forEach(e=>{
      const label = fmtDayLabel(e.ts);
      let g = groups.find(g=>g.label===label);
      if(!g){ g={label, items:[]}; groups.push(g); }
      g.items.push(e);
    });

    root.innerHTML = `
      <header>
        <div class="title">
          <h1>Violeta</h1>
          <span class="age">${fmtAge()}</span>
        </div>
      </header>
      <div class="stats">
        <div class="stat feed">
          <div class="label">Última toma</div>
          <div class="value">${lastFeed ? timeAgo(lastFeed.ts) : '—'}</div>
          ${badgeHtml(lastFeed?lastFeed.ts:null, 'feed')}
        </div>
        <div class="stat diaper">
          <div class="label">Último pañal</div>
          <div class="value">${lastDiaper ? timeAgo(lastDiaper.ts) : '—'}</div>
          ${badgeHtml(lastDiaper?lastDiaper.ts:null, 'diaper')}
        </div>
        <div class="stat sleep">
          <div class="label">${sleepStart? 'Durmiendo desde' : 'Despertó'}</div>
          <div class="value">${sleepStart ? timeAgo(sleepStart) : (lastSleepEnd ? timeAgo(lastSleepEnd.end) : '—')}</div>
          ${sleepStart ? badgeHtml(sleepStart, 'sleep') : (lastSleepEnd ? badgeHtml(lastSleepEnd.end, 'awake') : '')}
          ${sleepStart ? `<button class="sleep-edit-link" data-action="edit-sleep-start">editar hora</button>` : ''}
        </div>
        <div class="stat pump">
          <div class="label">Última extracción</div>
          <div class="value">${lastPump ? timeAgo(lastPump.ts) : '—'}</div>
          ${badgeHtml(lastPump?lastPump.ts:null, 'pump')}
        </div>
      </div>
      <div class="actions">
        <div>
          <button class="action feed" data-action="panel-feed"><span>Toma</span><span class="icon">🍼</span></button>
          <div class="subpanel feed ${openPanel==='feed'?'open':''}">
            <button data-action="feed-pecho">Pecho</button>
            <button data-action="feed-biberon">Biberón</button>
          </div>
        </div>
        <div>
          <button class="action diaper" data-action="panel-diaper"><span>Pañal</span><span class="icon">🧷</span></button>
          <div class="subpanel diaper ${openPanel==='diaper'?'open':''}">
            <button data-action="diaper-mojado">Mojado</button>
            <button data-action="diaper-sucio">Sucio</button>
            <button data-action="diaper-mixto">Mixto</button>
          </div>
        </div>
        <button class="action sleep ${sleepStart?'active':''}" data-action="toggle-sleep">
          <span>${sleepStart ? 'Durmiendo… toca para despertar' : 'Sueño'}</span><span class="icon">${sleepStart?'⏰':'🌙'}</span>
        </button>
        <div>
          <button class="action pump" data-action="panel-pump"><span>Extracción</span><span class="icon">🥛</span></button>
          <div class="subpanel pump ${openPanel==='pump'?'open':''}" style="align-items:center;">
            <input type="number" inputmode="numeric" placeholder="ml" id="pump-amount-input" style="border:1px solid var(--line); border-radius:12px; padding:9px; width:70px; font-size:13px;">
            <button data-action="pump-save" style="background:var(--pump); color:#fff; border:none;">Guardar</button>
          </div>
        </div>
      </div>
      <div class="notif-row" style="text-align:center; margin:-10px 0 18px;">
        ${notifEnabled
          ? `<span style="font-size:12px; color:var(--ink-soft);">🔔 Recordatorios activados</span>`
          : `<button class="add-past" data-action="enable-notif" style="border-style:solid;">🔔 Activar recordatorios en el celular</button>`
        }
      </div>
      <div class="timeline">
        <h2>Registro</h2>
        ${groups.length===0 ? '<div class="empty">Aún no hay registros. Toca un botón arriba para empezar.</div>' :
          groups.map(g=>`
            <div class="day-group">
              <div class="day-label">${g.label}</div>
              ${g.items.map(e=>`
                <div class="entry ${e.type}">
                  <span class="dot"></span>
                  <span class="desc">${labelFor(e)}${e.type==='sleep' ? (()=>{ const a=awakeBeforeSleep(e); return a ? `<span class="sub">Despierta antes: ${a}</span>` : ''; })() : ''}</span>
                  <span class="time">${fmtClock(e.ts)}</span>
                  <button class="edit" data-action="edit" data-id="${e.id}">✎</button>
                  <button class="del" data-action="del" data-id="${e.id}">✕</button>
                </div>
              `).join('')}
            </div>
          `).join('')
        }
      </div>
      <button class="add-past" data-action="open-add">+ Agregar registro atrasado</button>
      ${renderModal()}
    `;

    root.querySelectorAll('[data-action]').forEach(el=>{
      const action = el.getAttribute('data-action');
      el.addEventListener('click', (ev)=>{
        if(action==='panel-feed') togglePanel('feed');
        else if(action==='panel-diaper') togglePanel('diaper');
        else if(action==='feed-pecho') logFeed('pecho');
        else if(action==='feed-biberon') logFeed('biberon');
        else if(action==='diaper-mojado') logDiaper('mojado');
        else if(action==='diaper-sucio') logDiaper('sucio');
        else if(action==='diaper-mixto') logDiaper('mixto');
        else if(action==='toggle-sleep') toggleSleep();
        else if(action==='log-pump') logPump();
        else if(action==='panel-pump') togglePanel('pump');
        else if(action==='pump-save'){
          const input = document.getElementById('pump-amount-input');
          const val = input && input.value ? Number(input.value) : null;
          logPump(val);
        }
        else if(action==='enable-notif') enableNotifications();
        else if(action==='del') deleteEntry(el.getAttribute('data-id'));
        else if(action==='edit'){
          const entry = entries.find(x=>x.id===el.getAttribute('data-id'));
          if(entry) openEditModal(entry);
        }
        else if(action==='edit-sleep-start') openEditSleepStart();
        else if(action==='open-add') openAddModal();
        else if(action==='modal-cancel') closeModal();
        else if(action==='modal-save') saveModal();
        else if(action==='modal-backdrop'){ if(ev.target===el) closeModal(); }
      });
    });

    if(modal){
      root.querySelectorAll('[data-field]').forEach(el=>{
        const field = el.getAttribute('data-field');
        const evName = (el.type==='checkbox') ? 'change' : 'change';
        el.addEventListener(evName, ()=>{
          const val = el.type==='checkbox' ? el.checked : el.value;
          modalSetField(field, val);
        });
      });
    }
  }

  load();
  setInterval(render, 60000);
})();

if('serviceWorker' in navigator){
  window.addEventListener('load', ()=>{
    navigator.serviceWorker.register('sw.js').catch(()=>{});
  });
}
</script>
</body>
</html>
