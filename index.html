<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Violeta - Registro</title>
<meta name="theme-color" content="#726BA0">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Violeta">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Lora:wght@500;600&family=Public+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#F5EFE6;
    --card:#FFFCF8;
    --ink:#37292C;
    --ink-soft:#6E5F62;
    --line:#E7DCCF;
    --feed:#C97B84;
    --feed-soft:#F3DEE0;
    --diaper:#7C9184;
    --diaper-soft:#DEE7E0;
    --sleep:#726BA0;
    --sleep-soft:#E2DFF0;
    --radius:18px;
  }
  *{box-sizing:border-box;}
  html,body{margin:0; height:100%; background:var(--bg);}
  body{
    color:var(--ink);
    font-family:'Public Sans', -apple-system, sans-serif;
    padding-top:env(safe-area-inset-top);
    padding-bottom:env(safe-area-inset-bottom);
  }
  .app{
    min-height:100%;
    padding:20px 16px 40px;
    max-width:480px;
    margin:0 auto;
  }
  .app h1,.app h2{font-family:'Lora', Georgia, serif; font-weight:600; margin:0;}
  header{margin-bottom:18px;}
  header .title{display:flex; align-items:baseline; justify-content:space-between;}
  header h1{font-size:26px; color:var(--ink);}
  header .age{font-size:14px; color:var(--ink-soft);}
  .stats{display:grid; grid-template-columns:repeat(3,1fr); gap:8px; margin:16px 0 20px;}
  .stat{background:var(--card); border:1px solid var(--line); border-radius:var(--radius); padding:10px 8px; text-align:center;}
  .stat .label{font-size:11px; color:var(--ink-soft); letter-spacing:0.02em;}
  .stat .value{font-family:'Lora',serif; font-size:15px; margin-top:2px;}
  .stat.feed{border-color:var(--feed);}
  .stat.diaper{border-color:var(--diaper);}
  .stat.sleep{border-color:var(--sleep);}
  .actions{display:flex; flex-direction:column; gap:10px; margin-bottom:26px;}
  .action{border-radius:var(--radius); border:none; padding:14px 16px; font-size:16px; font-weight:600; font-family:'Public Sans',sans-serif; color:#fff; display:flex; align-items:center; justify-content:space-between; cursor:pointer; width:100%; transition:transform 0.12s ease;}
  .action:active{transform:scale(0.98);}
  .action.feed{background:var(--feed);}
  .action.diaper{background:var(--diaper);}
  .action.sleep{background:var(--sleep);}
  .action.sleep.active{background:#3F3A63;}
  .action .icon{font-size:20px;}
  .subpanel{display:flex; gap:8px; margin-top:-4px; margin-bottom:2px; overflow:hidden; max-height:0; transition:max-height 0.2s ease;}
  .subpanel.open{max-height:60px;}
  .subpanel button{flex:1; border:1px solid var(--line); background:var(--card); border-radius:12px; padding:9px 6px; font-size:13px; color:var(--ink); cursor:pointer;}
  .subpanel.feed button:active{background:var(--feed-soft);}
  .subpanel.diaper button:active{background:var(--diaper-soft);}
  .timeline h2{font-size:15px; color:var(--ink-soft); font-weight:600; margin:22px 0 10px;}
  .day-group{margin-bottom:14px;}
  .day-label{font-size:12px; color:var(--ink-soft); margin-bottom:6px; padding-left:4px;}
  .entry{display:flex; align-items:center; gap:10px; background:var(--card); border:1px solid var(--line); border-radius:14px; padding:10px 12px; margin-bottom:6px;}
  .entry .dot{width:9px;height:9px;border-radius:50%;flex-shrink:0;}
  .entry.feed .dot{background:var(--feed);}
  .entry.diaper .dot{background:var(--diaper);}
  .entry.sleep .dot{background:var(--sleep);}
  .entry .desc{flex:1; font-size:14px;}
  .entry .time{font-size:12px; color:var(--ink-soft);}
  .entry .del{background:none; border:none; color:var(--ink-soft); font-size:16px; cursor:pointer; padding:2px 6px;}
  .empty{text-align:center; color:var(--ink-soft); font-size:14px; padding:24px 10px; border:1px dashed var(--line); border-radius:var(--radius);}
</style>
</head>
<body>
<div id="root" class="app"></div>
<script>
(function(){
  const STORAGE_KEY = 'violeta-log';
  const BIRTH = new Date('2026-09-05T00:00:00');
  let entries = [];
  let sleepStart = null;
  let openPanel = null;

  const root = document.getElementById('root');

  function load(){
    try{
      const raw = localStorage.getItem(STORAGE_KEY);
      if(raw){
        const parsed = JSON.parse(raw);
        entries = parsed.entries || [];
        sleepStart = parsed.sleepStart || null;
      }
    }catch(e){ entries = []; sleepStart = null; }
    render();
  }
  function save(){
    try{ localStorage.setItem(STORAGE_KEY, JSON.stringify({entries, sleepStart})); }
    catch(e){ console.error('No se pudo guardar', e); }
  }

  function fmtAge(){
    const ms = Date.now() - BIRTH.getTime();
    const days = Math.floor(ms/86400000);
    const hours = Math.floor((ms%86400000)/3600000);
    if(days<=0) return hours+' h de nacida';
    return days+' día'+(days===1?'':'s')+', '+hours+' h';
  }
  function timeAgo(ts){
    if(!ts) return '—';
    const diff = Date.now()-ts;
    if(diff<0) return 'ahora';
    const m = Math.floor(diff/60000);
    if(m<1) return 'ahora';
    if(m<60) return 'hace '+m+' min';
    const h = Math.floor(m/60);
    const rem = m%60;
    return 'hace '+h+'h'+(rem?' '+rem+'min':'');
  }
  function lastOf(type){
    const filtered = entries.filter(e=>e.type===type);
    if(!filtered.length) return null;
    return filtered.reduce((a,b)=> a.ts>b.ts?a:b);
  }
  function fmtClock(ts){
    return new Date(ts).toLocaleTimeString('es-CO',{hour:'2-digit',minute:'2-digit'});
  }
  function fmtDayLabel(ts){
    const d = new Date(ts);
    const today = new Date();
    const yest = new Date(); yest.setDate(today.getDate()-1);
    const sameDay = (a,b)=>a.toDateString()===b.toDateString();
    if(sameDay(d,today)) return 'Hoy';
    if(sameDay(d,yest)) return 'Ayer';
    return d.toLocaleDateString('es-CO',{day:'numeric',month:'short'});
  }
  function labelFor(e){
    if(e.type==='feed') return e.subtype==='pecho' ? 'Toma de pecho' : 'Toma de biberón';
    if(e.type==='diaper'){
      const map = {mojado:'Pañal mojado', sucio:'Pañal sucio', mixto:'Pañal mixto'};
      return map[e.subtype] || 'Pañal';
    }
    if(e.type==='sleep'){
      if(e.end){
        const mins = Math.round((e.end-e.ts)/60000);
        const h = Math.floor(mins/60), m = mins%60;
        return 'Durmió '+(h>0 ? h+'h '+m+'min' : m+'min');
      }
      return 'Empezó a dormir';
    }
    return '';
  }

  function logFeed(subtype){
    entries.push({id:Date.now()+'-'+Math.random(), type:'feed', subtype, ts:Date.now()});
    openPanel = null; render(); save();
  }
  function logDiaper(subtype){
    entries.push({id:Date.now()+'-'+Math.random(), type:'diaper', subtype, ts:Date.now()});
    openPanel = null; render(); save();
  }
  function toggleSleep(){
    if(sleepStart){
      entries.push({id:Date.now()+'-'+Math.random(), type:'sleep', ts:sleepStart, end:Date.now()});
      sleepStart = null;
    } else { sleepStart = Date.now(); }
    render(); save();
  }
  function deleteEntry(id){
    entries = entries.filter(e=>e.id!==id);
    render(); save();
  }
  function togglePanel(name){ openPanel = openPanel===name ? null : name; render(); }

  function render(){
    const lastFeed = lastOf('feed');
    const lastDiaper = lastOf('diaper');
    const sleepEntries = entries.filter(e=>e.type==='sleep');
    const lastSleepEnd = sleepEntries.length ? sleepEntries.reduce((a,b)=>a.end>b.end?a:b) : null;

    const sorted = [...entries].sort((a,b)=>b.ts-a.ts);
    const groups = [];
    sorted.forEach(e=>{
      const label = fmtDayLabel(e.ts);
      let g = groups.find(g=>g.label===label);
      if(!g){ g={label, items:[]}; groups.push(g); }
      g.items.push(e);
    });

    root.innerHTML = `
      <header>
        <div class="title">
          <h1>Violeta</h1>
          <span class="age">${fmtAge()}</span>
        </div>
      </header>
      <div class="stats">
        <div class="stat feed">
          <div class="label">Última toma</div>
          <div class="value">${lastFeed ? timeAgo(lastFeed.ts) : '—'}</div>
        </div>
        <div class="stat diaper">
          <div class="label">Último pañal</div>
          <div class="value">${lastDiaper ? timeAgo(lastDiaper.ts) : '—'}</div>
        </div>
        <div class="stat sleep">
          <div class="label">${sleepStart? 'Durmiendo desde' : 'Despertó'}</div>
          <div class="value">${sleepStart ? timeAgo(sleepStart) : (lastSleepEnd ? timeAgo(lastSleepEnd.end) : '—')}</div>
        </div>
      </div>
      <div class="actions">
        <div>
          <button class="action feed" data-action="panel-feed"><span>Toma</span><span class="icon">🍼</span></button>
          <div class="subpanel feed ${openPanel==='feed'?'open':''}">
            <button data-action="feed-pecho">Pecho</button>
            <button data-action="feed-biberon">Biberón</button>
          </div>
        </div>
        <div>
          <button class="action diaper" data-action="panel-diaper"><span>Pañal</span><span class="icon">🧷</span></button>
          <div class="subpanel diaper ${openPanel==='diaper'?'open':''}">
            <button data-action="diaper-mojado">Mojado</button>
            <button data-action="diaper-sucio">Sucio</button>
            <button data-action="diaper-mixto">Mixto</button>
          </div>
        </div>
        <button class="action sleep ${sleepStart?'active':''}" data-action="toggle-sleep">
          <span>${sleepStart ? 'Durmiendo… toca para despertar' : 'Sueño'}</span><span class="icon">${sleepStart?'⏰':'🌙'}</span>
        </button>
      </div>
      <div class="timeline">
        <h2>Registro</h2>
        ${groups.length===0 ? '<div class="empty">Aún no hay registros. Toca un botón arriba para empezar.</div>' :
          groups.map(g=>`
            <div class="day-group">
              <div class="day-label">${g.label}</div>
              ${g.items.map(e=>`
                <div class="entry ${e.type}">
                  <span class="dot"></span>
                  <span class="desc">${labelFor(e)}</span>
                  <span class="time">${fmtClock(e.ts)}</span>
                  <button class="del" data-action="del" data-id="${e.id}">✕</button>
                </div>
              `).join('')}
            </div>
          `).join('')
        }
      </div>
    `;

    root.querySelectorAll('[data-action]').forEach(el=>{
      const action = el.getAttribute('data-action');
      el.addEventListener('click', ()=>{
        if(action==='panel-feed') togglePanel('feed');
        else if(action==='panel-diaper') togglePanel('diaper');
        else if(action==='feed-pecho') logFeed('pecho');
        else if(action==='feed-biberon') logFeed('biberon');
        else if(action==='diaper-mojado') logDiaper('mojado');
        else if(action==='diaper-sucio') logDiaper('sucio');
        else if(action==='diaper-mixto') logDiaper('mixto');
        else if(action==='toggle-sleep') toggleSleep();
        else if(action==='del') deleteEntry(el.getAttribute('data-id'));
      });
    });
  }

  load();
  setInterval(render, 60000);
})();

if('serviceWorker' in navigator){
  window.addEventListener('load', ()=>{
    navigator.serviceWorker.register('sw.js').catch(()=>{});
  });
}
</script>
</body>
</html>
